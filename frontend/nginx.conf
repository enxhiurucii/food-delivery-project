# nginx in front of the React build: one origin (http://localhost:3000) for the SPA and both APIs, so no CORS.
#   /                    -> back-office SPA (restaurant management)
#   /webshop             -> customer webshop SPA (same build, different route tree)
#   /api/backoffice/...  -> backoffice-service /api/...
#   /api/webshop/...     -> webshop-service    /api/...
# /internal/** is intentionally NOT routed: it is service-to-service only.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Server-Sent Events: no buffering, long-lived connections
    location ~ ^/api/backoffice/(.*/stream)$ {
        proxy_pass http://backoffice:8081/api/$1$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location ~ ^/api/webshop/(.*/stream)$ {
        proxy_pass http://webshop:8082/api/$1$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location /api/backoffice/ {
        proxy_pass http://backoffice:8081/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/webshop/ {
        proxy_pass http://webshop:8082/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SPA fallback: client-side routing for / and /webshop/*
    location / {
        try_files $uri $uri/ /index.html;
    }
}
